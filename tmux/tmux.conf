set -g default-terminal "tmux-256color"

set -ga terminal-features ",*:RGB"
set -ga terminal-features ",*:clipboard"

set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

set -g bell-action none

unbind C-b
set -g prefix C-space
bind-key C-space send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

set -g mouse on
unbind -n MouseDrag1Pane
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode-vi MouseDrag1Pane

set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

set -g set-clipboard on

bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind m set monitor-activity
bind S set synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

set -g status on
set -g status-style "bg=default,fg=#a5adcb"
set -g status-justify left
 
set -g status-left-length 30
set -g status-right-length 30
set -g status-left "#[fg=#8aadf4,bold]#S #[default]"
set -g status-right "#[fg=#6e738d]%H:%M"
 
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#8aadf4,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#494d64"
set -g pane-active-border-style "fg=#8aadf4"

set -g window-status-activity-style "fg=#eed49f,bold"
set -g visual-activity off
